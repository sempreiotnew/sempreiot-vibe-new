# SempreIoT pin map — the single source for firmware/components/platform/siot_board_def.
# gen_board_def.py turns this into a C table at configure time (never edit the generated header).
#
# Phase 1 pins only (brief §1 table; from pocs/patinha/main/patinha.c, siot_led.c, node_button.c,
# serial_link.c). Phase 2 pins (BOOST 6, CHG 7, TAMPER 11, sensors, relay) are added here when
# their phase starts — never in C.
#
# Every entry: model (matches CONFIG_SIOT_DEV_MODEL), hw_rev (0 = any revision), pins.
# A pin of -1 means "not present on this model".
schema: 1
boards:
  - model: SIOT-BOARD-01
    family: board
    hw_rev: 0
    default: true          # used, with a warning, when CONFIG_SIOT_DEV_MODEL matches nothing
    pins:
      led_r: 14            # RGB LED, LEDC low-speed, timer 0, 8-bit, 5 kHz, active-high
      led_g: 47
      led_b: 48
      led_active_low: false
      button: 21           # RST/TEST, pull-up, active low
      acok: 5              # pull-up, 0 = AC present
      uart0_tx: 43         # flash / bench tablet link (CONFIG_SIOT_SERIAL_LINK_UART0)
      uart0_rx: 44
      usb_dm: 19           # native USB-Serial-JTAG (product tablet link)
      usb_dp: 20
  - model: SIOT-NODE-01
    family: node          # generic bench AC unit (devkit)
    hw_rev: 0
    pins:
      led_r: 14
      led_g: 47
      led_b: 48
      led_active_low: false
      button: 21
      acok: 5
      uart0_tx: 43         # flash + console on nodes
      uart0_rx: 44
      usb_dm: 19
      usb_dp: 20
  - model: SIOT-LEAF-01
    family: leaf          # generic bench battery unit (devkit)
    hw_rev: 0
    pins:                  # battery detector: same devkit wiring as the node (docs/spec/definition-detector.md)
      led_r: 14
      led_g: 47
      led_b: 48
      led_active_low: false
      button: 21           # RST/TEST, pull-up, active low — also the deep-sleep wake pin (RTC IO)
      acok: 5
      uart0_tx: 43         # flash + bench log (the native USB console drops on every sleep)
      uart0_rx: 44
      usb_dm: 19
      usb_dp: 20

  # ---- Product catalogue (docs/sempreiot-system-reference.md §2.1), 2026-09-28 ----
  # Pins below are the devkit's until each PCB's GPIO map exists; the product-
  # specific peripherals (sounder, station button, sensors) are added here when
  # their feature component lands — never in C.
  - model: SIOT-SIREN-01      # AC siren: node image + sounder driver (features/siot_siren, planned)
    family: node
    hw_rev: 0
    pins: {led_r: 14, led_g: 47, led_b: 48, led_active_low: false, button: 21, acok: 5, uart0_tx: 43, uart0_rx: 44, usb_dm: 19, usb_dp: 20}
  - model: SIOT-PBS-01        # AC push-button (manual call) station: node image + station input (planned)
    family: node
    hw_rev: 0
    pins: {led_r: 14, led_g: 47, led_b: 48, led_active_low: false, button: 21, acok: 5, uart0_tx: 43, uart0_rx: 44, usb_dm: 19, usb_dp: 20}
  - model: SIOT-SMOKE-01      # battery smoke detector: leaf image + ADPD188BI / HDC2080 (sensing phase)
    family: leaf
    hw_rev: 0
    pins: {led_r: 14, led_g: 47, led_b: 48, led_active_low: false, button: 21, acok: 5, uart0_tx: 43, uart0_rx: 44, usb_dm: 19, usb_dp: 20}
