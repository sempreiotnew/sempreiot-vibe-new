name: sempreiot_central_app
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'


dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  flutter_riverpod: ^2.5.0
  http: ^1.2.0
  web: ^1.1.0
  amplify_flutter: ^2.5.0
  amplify_auth_cognito: ^2.5.0
  flutter_dotenv: ^5.1.0
  crypto: ^3.0.3
  aws_signature_v4: ^0.6.10
  aws_common: ^0.7.13
  web_socket_channel: ^3.0.3
  connectivity_plus: ^7.1.1
  usb_serial: ^0.5.1
  drift: ^2.18.0
  drift_flutter: ^0.2.2
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.4
  pointycastle: ^3.9.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.2.0
  shared_preferences: ^2.3.0
  app_settings: ^6.1.1
  flutter_secure_storage: ^9.2.2
  file_picker: ^11.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0
  drift_dev: ^2.18.0
  build_runner: ^2.4.9


flutter:

  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - .env
    - assets/images/logo_no_shadow.png
    - assets/images/google_icon.png
    - assets/images/logo_no_color.png
    # Rede 3D prototype: the smoke detector pre-rendered from
    # assets/models/smoke_detector.glb (the .glb itself is not bundled).
    - assets/models/smoke_detector_atlas.png
    - assets/models/smoke_detector_rim.png
    - assets/models/smoke_detector_frames.json
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages
